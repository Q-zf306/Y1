<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jacaranda Corner · 悉尼蓝花楹街角</title>
<style>
  :root{
    --ink:#253041;
    --muted:#78828c;
    --paper:#f7f4ec;
    --line:rgba(45,55,70,.12);
    --violet:#7762b9;
    --violet-deep:#594698;
    --cream:#fffdf7;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{
    background:
      radial-gradient(1100px 640px at 78% 8%, rgba(191,178,231,.18), transparent 65%),
      linear-gradient(180deg,#fbfaf6 0%,#f4f0e7 100%);
    color:var(--ink);
    font-family:"Avenir Next","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(37,48,65,.10) .55px,transparent .55px);
    background-size:7px 7px;opacity:.22;
    mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 72%,transparent);
  }
  .page{
    height:100svh;display:flex;flex-direction:column;
    padding:clamp(16px,2.4vw,30px) clamp(18px,4vw,56px) clamp(14px,2vw,24px);
    position:relative;overflow:hidden;
  }
  header{
    width:min(1180px,100%);margin:0 auto 18px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    position:relative;z-index:3;
  }
  .eyebrow{
    display:flex;align-items:center;gap:10px;
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--violet);
    font-weight:700;
  }
  .eyebrow::before{content:"";width:24px;height:1px;background:var(--violet);opacity:.7}
  h1{
    margin:8px 0 0;font-family:"Iowan Old Style","Baskerville","Songti SC","Noto Serif SC",serif;
    font-size:clamp(27px,4.4vw,50px);line-height:1.02;font-weight:500;letter-spacing:-.025em;
  }
  h1 em{font-style:italic;color:var(--violet-deep)}
  .sub{margin:9px 0 0;color:var(--muted);font-size:12px;letter-spacing:.04em}
  .times{
    flex:none;display:flex;align-items:center;gap:3px;padding:4px;
    border:1px solid var(--line);background:rgba(255,253,247,.76);
    border-radius:999px;backdrop-filter:blur(12px);
    box-shadow:0 8px 24px rgba(52,41,69,.06);
  }
  .times button{
    border:0;background:transparent;color:#7b8390;cursor:pointer;
    font:500 11px/1 inherit;padding:9px 13px;border-radius:999px;transition:.22s ease;
    letter-spacing:.06em;white-space:nowrap;
  }
  .times button:hover{color:var(--ink)}
  .times button.on{
    color:#fff;background:var(--violet);box-shadow:0 4px 12px rgba(89,70,152,.22);
  }
  .times .auto{
    display:flex;align-items:center;gap:6px;padding:9px 11px;margin-left:4px;
    border-left:1px solid var(--line);border-radius:0;
    color:#85838b;
  }
  .times .auto:hover{color:var(--ink)}
  .times .auto .dial{
    width:12px;height:12px;border-radius:50%;position:relative;flex:none;
    background:conic-gradient(var(--violet) calc(var(--cycle,0) * 1%), rgba(109,98,128,.18) 0);
    transition:background .18s linear;
  }
  .times .auto .dial::after{
    content:"";position:absolute;inset:3px;border-radius:50%;background:#fffdf7;
  }
  .times .auto b{font:500 9px/1 ui-monospace,monospace;color:#aaa2b1;letter-spacing:0}
  .times .auto.running{color:var(--violet-deep)}
  .times .auto.running .dial{box-shadow:0 0 0 3px rgba(119,98,185,.08)}
  .times .auto.running b{color:var(--violet)}
  .times .music{
    display:flex;align-items:center;gap:6px;padding:9px 11px;
    border-left:1px solid var(--line);border-radius:0 999px 999px 0;
    color:#8a8891;
  }
  .times .music .eq{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:12px;height:12px}
  .times .music .eq i{display:block;width:2px;height:4px;border-radius:2px;background:#a59ab8;
    transform-origin:50% 100%;transition:background .2s}
  .times .music.playing{color:var(--violet-deep)}
  .times .music.playing .eq i{background:var(--violet);animation:eqPulse .9s ease-in-out infinite}
  .times .music.playing .eq i:nth-child(2){height:8px;animation-delay:.18s;animation-duration:.72s}
  .times .music.playing .eq i:nth-child(3){height:6px;animation-delay:.36s;animation-duration:1.05s}
  @keyframes eqPulse{
    0%,100%{transform:scaleY(.55)}
    45%{transform:scaleY(1.5)}
    70%{transform:scaleY(.8)}
  }
  .stage{
    width:min(1180px,100%);margin:0 auto;flex:1;min-height:480px;
    position:relative;border-radius:28px;overflow:hidden;min-height:0;
    border:1px solid rgba(255,255,255,.92);
    background:#edf1f0;
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 46px 90px -46px rgba(52,44,62,.36),
      0 12px 34px -20px rgba(52,44,62,.18);
    isolation:isolate;
  }
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(40,50,60,.05);
  }
  #scene{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none;z-index:1;background:transparent}
  #scene:active{cursor:grabbing}
  #sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  #birds{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .hint{
    position:absolute;left:18px;bottom:16px;z-index:2;pointer-events:none;
    display:flex;align-items:center;gap:8px;color:rgba(34,43,56,.58);
    font-size:10px;letter-spacing:.08em;
  }
  .hint i{width:22px;height:22px;border:1px solid rgba(34,43,56,.18);border-radius:50%;
    display:grid;place-items:center;font-style:normal;font-size:12px;background:rgba(255,255,255,.4)}
  .badge{
    position:absolute;right:18px;top:16px;z-index:2;pointer-events:none;
    padding:8px 11px;border-radius:8px;color:rgba(34,43,56,.58);
    background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.7);
    backdrop-filter:blur(10px);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  }
  .loading{
    position:absolute;inset:0;display:grid;place-items:center;z-index:4;
    background:#e9eeed;transition:opacity .5s ease;color:var(--muted);
    font-size:10px;letter-spacing:.22em;
  }
  .loading.off{opacity:0;pointer-events:none}
  footer{
    width:min(1180px,100%);margin:14px auto 0;display:flex;justify-content:space-between;gap:20px;
    font-size:9px;color:#9a9386;letter-spacing:.15em;text-transform:uppercase;
  }
  @media (max-width:760px){
    .page{padding:16px 12px 18px}
    header{align-items:flex-start;flex-direction:column;gap:13px;margin-bottom:13px}
    .times{align-self:flex-start}
    .stage{min-height:0;height:calc(100svh - 190px);border-radius:20px}
    .hint{left:12px;bottom:11px;font-size:9px}
    .badge{right:12px;top:12px;font-size:8px}
    footer{display:none}
    h1{font-size:29px}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <div class="eyebrow">A miniature Sydney corner</div>
      <h1>蓝花楹街角 <em>Jacaranda</em></h1>
      <p class="sub">奶油白历史立面 · 铁艺阳台 · 一棵树也不肯安静</p>
    </div>
    <div class="times" role="group" aria-label="时段切换与自动循环">
      <button class="on" data-mode="day">白天</button>
      <button data-mode="dusk">黄昏</button>
      <button data-mode="night">夜晚</button>
      <button class="auto running" id="autoTime" type="button" aria-pressed="true" title="自动循环：白天、黄昏、夜晚各 10 秒，30 秒一轮；快捷键 A">
        <span class="dial" aria-hidden="true"></span><span>自动</span><b>30s</b>
      </button>
      <button class="music" id="musicBtn" type="button" aria-pressed="false" title="播放背景音乐《穿越时空的思念》；快捷键 M">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span>音乐</span>
      </button>
    </div>
  </header>
  <main class="stage">
    <canvas id="scene" aria-label="可拖拽旋转与缩放的悉尼蓝花楹街角微缩场景"></canvas>
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="birds" aria-hidden="true"></canvas>
    <div class="loading" id="loading">ASSEMBLING THE CORNER</div>
    <div class="badge">Toon study · 03</div>
    <div class="hint"><i>↻</i> 拖拽旋转 · 滚轮缩放</div>
  </main>
  <footer><span>Jacaranda mimosifolia</span><span>Sydney · late spring</span></footer>
</div>

<audio id="bgm" src="assets/jacaranda-theme.mp3" loop preload="auto" playsinline></audio>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.161.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------
   Renderer · scene · camera
------------------------------------------------------------------ */
const TAU = Math.PI * 2;
const canvas = document.getElementById('scene');
const stage = canvas.parentElement;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight, false);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.03;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;

const scene = new THREE.Scene();
scene.background = null;
scene.fog = new THREE.Fog(0xe7edeb, 58, 108);

const camera = new THREE.PerspectiveCamera(35, stage.clientWidth / stage.clientHeight, .1, 180);
camera.position.set(26, 25, 58);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 7.2, .8);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.enablePan = false;
controls.minDistance = 23;
controls.maxDistance = 61;
controls.minPolarAngle = .33;
controls.maxPolarAngle = 1.31;
controls.rotateSpeed = .65;
controls.zoomSpeed = .8;
controls.update();

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .025).texture;

/* ------------------------------------------------------------------
   A deliberately small three-step ramp for the toon materials
------------------------------------------------------------------ */
const ramp = document.createElement('canvas');
ramp.width = 3; ramp.height = 1;
const rctx = ramp.getContext('2d');
rctx.fillStyle = '#716a64'; rctx.fillRect(0, 0, 1, 1);
rctx.fillStyle = '#c7bfb5'; rctx.fillRect(1, 0, 1, 1);
rctx.fillStyle = '#fffaf1'; rctx.fillRect(2, 0, 1, 1);
const gradientMap = new THREE.CanvasTexture(ramp);
gradientMap.minFilter = THREE.NearestFilter;
gradientMap.magFilter = THREE.NearestFilter;
gradientMap.generateMipmaps = false;

const MAT = {
  cream:   new THREE.MeshToonMaterial({ color: 0xecdec4, gradientMap }),
  creamHi: new THREE.MeshToonMaterial({ color: 0xfff3db, gradientMap }),
  creamLo: new THREE.MeshToonMaterial({ color: 0xcbb898, gradientMap }),
  stone:   new THREE.MeshToonMaterial({ color: 0xd3c5ad, gradientMap }),
  roof:    new THREE.MeshToonMaterial({ color: 0x4d5960, gradientMap }),
  wood:    new THREE.MeshToonMaterial({ color: 0x765a9d, gradientMap }),
  woodHi:  new THREE.MeshToonMaterial({ color: 0x9b78c4, gradientMap }),
  iron:    new THREE.MeshToonMaterial({ color: 0x29313b, gradientMap }),
  leaf:    new THREE.MeshToonMaterial({ color: 0x536e58, gradientMap }),
  bark:    new THREE.MeshToonMaterial({ color: 0x574841, gradientMap }),
  trunk:   new THREE.MeshToonMaterial({ color: 0x65534a, gradientMap }),
  flower:  new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap, emissive: 0x4b367d, emissiveIntensity: 0, side: THREE.DoubleSide }),
  puff:    new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap, emissive: 0x35235e, emissiveIntensity: 0, side: THREE.DoubleSide }),
  gold:    new THREE.MeshStandardMaterial({ color: 0xb89858, metalness: .68, roughness: .28 }),
  metal:   new THREE.MeshStandardMaterial({ color: 0x293039, metalness: .78, roughness: .26 }),
  teak:    new THREE.MeshToonMaterial({ color: 0x4a3427, gradientMap }),
  teakHi:  new THREE.MeshToonMaterial({ color: 0x74533b, gradientMap }),
  paper:   new THREE.MeshToonMaterial({ color: 0xf6e8ce, gradientMap, side: THREE.DoubleSide }),
  paperAlt:new THREE.MeshToonMaterial({ color: 0xb39bb8, gradientMap, side: THREE.DoubleSide }),
  goWood:  new THREE.MeshToonMaterial({ color: 0xd1aa70, gradientMap }),
  stoneB:  new THREE.MeshToonMaterial({ color: 0x282a2e, gradientMap }),
  stoneW:  new THREE.MeshToonMaterial({ color: 0xf0ede2, gradientMap }),
  cushion: new THREE.MeshToonMaterial({ color: 0x7d5661, gradientMap }),
  ceramic: new THREE.MeshStandardMaterial({ color: 0xe9dfcc, metalness: .05, roughness: .42 }),
  glassBase: () => new THREE.MeshPhysicalMaterial({
    color: 0x5f7a80, metalness: .06, roughness: .07, transmission: .2,
    transparent: true, opacity: .68, envMapIntensity: 1.55,
    emissive: 0xff8b32, emissiveIntensity: 0, side: THREE.DoubleSide
  }),
  paving: new THREE.MeshToonMaterial({ color: 0xc9c8bf, gradientMap }),
  road:   new THREE.MeshToonMaterial({ color: 0x9ca6a9, gradientMap }),
  curb:   new THREE.MeshToonMaterial({ color: 0xe3ded2, gradientMap }),
  darkGlass: new THREE.MeshPhysicalMaterial({
    color: 0x26363e, metalness: .15, roughness: .15,
    transparent: true, opacity: .78, transmission: .12, envMapIntensity: 1.2
  })
};
const glassMats = [];

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------ */
const world = new THREE.Group();
scene.add(world);
const clock = new THREE.Clock();
const rand = (() => {
  let seed = 0x1eafcafe;
  return () => {
    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
    return (seed >>> 0) / 4294967296;
  };
})();

function mesh(geo, material, parent = world, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = cast; m.receiveShadow = receive;
  parent.add(m); return m;
}
function box(w, h, d, mat, x, y, z, parent = world, cast = true) {
  const m = mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(.06, w * .04, h * .04)), mat, parent, cast, true);
  m.position.set(x, y, z); return m;
}
function cyl(r1, r2, h, mat, x, y, z, parent = world, cast = true, seg = 14) {
  const m = mesh(new THREE.CylinderGeometry(r1, r2, h, seg), mat, parent, cast, true);
  m.position.set(x, y, z); return m;
}
function makeRoundRect(w, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, z = -d / 2;
  s.moveTo(x + r, z);
  s.lineTo(x + w - r, z); s.quadraticCurveTo(x + w, z, x + w, z + r);
  s.lineTo(x + w, z + d - r); s.quadraticCurveTo(x + w, z + d, x + w - r, z + d);
  s.lineTo(x + r, z + d); s.quadraticCurveTo(x, z + d, x, z + d - r);
  s.lineTo(x, z + r); s.quadraticCurveTo(x, z, x + r, z);
  return s;
}
function archShape(w, h) {
  const r = w / 2, spring = h - r;
  const s = new THREE.Shape();
  s.moveTo(-r, 0); s.lineTo(-r, spring);
  s.absarc(0, spring, r, Math.PI, 0, true);
  s.lineTo(r, 0); s.closePath();
  return s;
}
function archedPanel(w, h, depth, mat, bevel = .035) {
  const shape = archShape(w, h);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel,
    bevelSegments: 2, curveSegments: 18
  });
  return mesh(g, mat, world, true, true);
}

/* ------------------------------------------------------------------
   Base · pavement · street corner
------------------------------------------------------------------ */
const base = new THREE.Group(); world.add(base);
const plinth = mesh(new RoundedBoxGeometry(43, 1.15, 43, 5, .7), MAT.stone, base);
plinth.position.y = -.35;
const baseTop = mesh(new RoundedBoxGeometry(42.2, .12, 42.2, 4, .55), MAT.paving, base);
baseTop.position.y = .25;
// Inset pavement and two quiet street bands make the square read as a corner.
const walk = box(38.5, .035, 38.5, new THREE.MeshToonMaterial({ color: 0xd7d5ca, gradientMap }), 0, .32, 0, base, false);
walk.rotation.y = 0;
const roadFront = box(42.4, .028, 5.3, MAT.road, 0, .345, 18.7, base, false);
roadFront.receiveShadow = true;
const roadSide = box(5.3, .028, 37.1, MAT.road, 18.7, .345, -1.0, base, false);
roadSide.receiveShadow = true;
const curbF = box(42.4, .17, .34, MAT.curb, 0, .36, 15.9, base, false);
const curbS = box(.34, .17, 36.6, MAT.curb, 15.9, .36, -3.0, base, false);
// softly rounded street marking, almost a sketch line
const dashMat = new THREE.MeshBasicMaterial({ color: 0xf4f0df, transparent: true, opacity: .62 });
for (let x = -17; x <= 15; x += 6) box(2.8, .012, .12, dashMat, x, .37, 20.2, base, false);
for (let z = 7; z <= 14; z += 6) box(.12, .012, 2.8, dashMat, 20.2, .37, z - 17, base, false);

/* ------------------------------------------------------------------
   Historic three-storey building with a curved corner
------------------------------------------------------------------ */
const building = new THREE.Group(); world.add(building);
const H = 17.1;
const foot = new THREE.Shape();
foot.moveTo(-10.7, -9.3);
foot.lineTo(10.7, -9.3);
foot.lineTo(10.7, 3.0);
foot.quadraticCurveTo(10.7, 9.4, 4.3, 9.4);
foot.lineTo(-10.7, 9.4);
foot.closePath();
const bodyGeo = new THREE.ExtrudeGeometry(foot, { depth: H, bevelEnabled: false, curveSegments: 30 });
bodyGeo.rotateX(Math.PI / 2);
bodyGeo.translate(0, H, 0);
const body = mesh(bodyGeo, MAT.cream, building, true, true);
body.position.y = .3;
// A shadow-coloured inner reveal makes openings feel cut, never outlined in black.
const innerWall = mesh(bodyGeo.clone(), new THREE.MeshToonMaterial({ color: 0xcabda9, gradientMap }), building, false, true);
innerWall.scale.set(.965, 1, .965); innerWall.position.y = .3;

// plinth and broad storey bands
const plinthGeo = new THREE.ExtrudeGeometry(foot, { depth: .52, bevelEnabled: false, curveSegments: 30 });
plinthGeo.rotateX(Math.PI / 2); plinthGeo.translate(0, .52, 0);
const buildingPlinth = mesh(plinthGeo, MAT.creamLo, building);
buildingPlinth.position.y = .3; buildingPlinth.scale.set(1.018, 1, 1.018);
function band(y, thickness = .18, depth = .22, material = MAT.creamHi) {
  const front = box(15.1, thickness, depth, material, -3.1, y, 9.55, building, false);
  front.receiveShadow = true;
  const side = box(depth, thickness, 12.5, material, 10.85, y, -3.0, building, false);
  side.receiveShadow = true;
  const arc = mesh(new THREE.TorusGeometry(6.56, thickness * .48, 5, 34, Math.PI / 2), material, building, false, true);
  arc.rotation.x = Math.PI / 2; arc.position.set(4.14, y, 2.84);
  return { front, side, arc };
}
band(5.76, .22, .26);
band(11.18, .22, .26);
band(H + .35, .38, .38);

// subtle corner pilasters and cornice blocks
const cornerWin = new THREE.Group(); building.add(cornerWin);
const corner = new THREE.Vector2(4.14, 2.84);
const C_RADIUS = 6.56;
function onCorner(angle, out = 0) {
  const a = angle * Math.PI / 180;
  return { x: corner.x + Math.cos(a) * (C_RADIUS + out), z: corner.y + Math.sin(a) * (C_RADIUS + out), a };
}

/* windows */
function makeWindow(x, z, y, facing, width = 1.25, height = 2.55, ground = false) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = facing;
  building.add(g);
  const frame = new THREE.Shape();
  const w = width, h = height, r = w / 2, spring = h - r;
  frame.moveTo(-r, 0); frame.lineTo(-r, spring);
  frame.absarc(0, spring, r, Math.PI, 0, true); frame.lineTo(r, 0); frame.closePath();
  const inset = new THREE.Path();
  const iw = w * .77, ih = h * .82, ir = iw / 2, isp = ih - ir;
  inset.moveTo(-ir, .12); inset.lineTo(-ir, isp);
  inset.absarc(0, isp, ir, Math.PI, 0, true); inset.lineTo(ir, .12); inset.closePath();
  frame.holes.push(inset);
  const fg = new THREE.ExtrudeGeometry(frame, {
    depth: .16, bevelEnabled: true, bevelThickness: .035, bevelSize: .035,
    bevelSegments: 2, curveSegments: 16
  });
  const fm = mesh(fg, MAT.creamHi, g, false, true); fm.position.z = -.045;
  const glassMat = MAT.glassBase();
  const litCycle = [.58, 1.0, .72, .9, .46, .84];
  glassMat.userData.lit = litCycle[glassMats.length % litCycle.length];
  glassMats.push(glassMat);
  const glassShape = archShape(iw * .96, ih * .96);
  const glass = mesh(new THREE.ShapeGeometry(glassShape, 18), glassMat, g, false, false);
  glass.position.set(0, .16, .135);
  glass.renderOrder = 2;
  // slim muntins
  const barMat = MAT.creamLo;

function arcSlab(rIn, rOut, y, thick, mat, start = 0, end = Math.PI / 2) {
  const s = new THREE.Shape();
  s.absarc(corner.x, corner.y, rOut, start, end, false);
  s.lineTo(corner.x + Math.cos(end) * rIn, corner.y + Math.sin(end) * rIn);
  s.absarc(corner.x, corner.y, rIn, end, start, true);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: false, curveSegments: 30 });
  g.rotateX(Math.PI / 2); g.translate(0, y + thick, 0);
  return mesh(g, mat, building, true, true);
}

/* striped curved canopy over the balcony */
function canopySector(rIn, rOut, yIn, yOut, a0, a1, material, segments = 8) {
  const pos = [], idx = [];
  for (let i = 0; i <= segments; i++) {
    const a = a0 + (a1 - a0) * i / segments;
    const ca = Math.cos(a), sa = Math.sin(a);
    pos.push(corner.x + ca * rIn, yIn, corner.y + sa * rIn);
    pos.push(corner.x + ca * rOut, yOut, corner.y + sa * rOut);
    if (i < segments) {
      const k = i * 2;
      idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, material); m.castShadow = true; m.receiveShadow = true; building.add(m);
  return m;
}

// A blossom is a tiny five-petal corolla, not a sphere. Thousands of these
// read as the granular lavender masses characteristic of Jacaranda.
function makeBlossomGeometry() {
  const pieces = [];
  for (let i = 0; i < 5; i++) {
    const petal = new THREE.CircleGeometry(.074, 7);
    petal.scale(2.05, 1.0, 1);
    petal.translate(.085, 0, 0);
    petal.rotateZ(i * Math.PI * 2 / 5 + .1);
    pieces.push(petal);
  }
  const throat = new THREE.CircleGeometry(.04, 6);
  throat.translate(0, 0, .008);
  pieces.push(throat);
  // a shallow five-sided trumpet lifts the centre off the flat rosette
  const bell = new THREE.CylinderGeometry(.052, .018, .105, 5, 1, true);

  { x: .40, y: .006, s: .15, v: .0029, sprite: 1, alpha: .62, phase: 5.1 },
  { x: .50, y: .012, s: .24, v: .0042, sprite: 2, alpha: .91, phase: 4.0 },
  { x: .66, y: .094, s: .13, v: .0027, sprite: 2, alpha: .57, phase: .8 },
  { x: .76, y: .105, s: .17, v: .0030, sprite: 0, alpha: .76, phase: 1.4 },
  { x: 1.02, y: .045, s: .26, v: .0038, sprite: 1, alpha: .88, phase: 3.2 }
];

const goosePattern = [
  [0, 0], [.52, .52], [1.04, 1.04], [1.56, 1.56],
  [.52, -.52], [1.04, -1.04], [1.56, -1.56], [2.08, 2.08]
];
const flock = {
  x: -.12, y: .09, dir: 1, speed: .055, armed: false,
  birds: goosePattern.map((p, i) => ({
    lag: p[0], side: p[1],
    phase: rand() * TAU,
    size: .84 + rand() * .3,
    alpha: .78 + rand() * .16
  }))
};
function drawGoose(g, x, y, size, flap, alpha) {
  const wingY = -size * (.18 + flap * .44);
  g.save();
  g.translate(x, y);
  g.strokeStyle = `rgba(47,48,61,${alpha.toFixed(3)})`;
  g.lineWidth = Math.max(1.1, size * .13);
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(-size, wingY);
  g.quadraticCurveTo(-size * .42, size * .12, 0, size * .02);
  g.quadraticCurveTo(size * .42, size * .12, size, wingY);
  g.stroke();
  g.beginPath();
  g.moveTo(0, size * .01);
  g.lineTo(0, size * .29);
  g.stroke();
  g.restore();
}
function drawGeese(g, dt, time, duskness) {
  g.clearRect(0, 0, skyW, skyH);
  if (duskness < .035) {
    flock.armed = false;
    return;
  }
  if (!flock.armed) {
    flock.armed = true;
    flock.dir = rand() < .5 ? 1 : -1;
    flock.x = flock.dir > 0 ? .18 : .82;
    flock.y = .062 + rand() * .012;
  }
  flock.x += flock.dir * flock.speed * dt;
  if ((flock.dir > 0 && flock.x > 1.3) || (flock.dir < 0 && flock.x < -.36)) {
    flock.x = flock.dir > 0 ? -.2 : 1.2;
  }
  const spacing = skyW * .034;
  for (const bird of flock.birds) {
    const x = flock.x * skyW - flock.dir * bird.lag * spacing;
    const y = flock.y * skyH + bird.side * spacing * .43;
    const s = Math.max(12, skyW * .016 * bird.size);
    const flap = Math.sin(time * 5.8 + bird.phase);
    drawGoose(g, x, y, s, flap, duskness * bird.alpha);
  }
}

const meteors = [];
let meteorCooldown = .28;
let nightArmed = false;

function spawnMeteor() {
  const fromLeft = rand() < .5;
  const x = fromLeft ? skyW * (.7 + rand() * .24) : skyW * (.06 + rand() * .24);
  const y = skyH * (.035 + rand() * .08);
  const angle = (16 + rand() * 15) * Math.PI / 180;
  const dirX = fromLeft ? -Math.cos(angle) : Math.cos(angle);
  const dirY = Math.sin(angle);
  meteors.push({
    x, y, dx: dirX, dy: dirY,
    travel: skyW * (.60 + rand() * .22),
    trail: skyW * (.16 + rand() * .09),
    life: .8 + rand() * .32,
    age: 0
  });
}

function drawSkyLayer(dt, time) {
  skyCtx.clearRect(0, 0, skyW, skyH);
  // The sky lives behind the transparent WebGL canvas, so clouds and stars
  // are correctly hidden by the building, balcony, trunks and leaves.
  skyCtx.fillStyle = '#' + bgColor.getHexString();
  skyCtx.fillRect(0, 0, skyW, skyH);

  const dayness = 1 - THREE.MathUtils.smoothstep(modePhase, .52, 1.3);
  if (dayness > .01) {
    for (const c of clouds) {
      c.x += c.v * dt;
      const cw = skyW * c.s;
      const ch = cw * (270 / 640);
      if (c.x > 1.16) c.x = -c.s - .02;
      const bob = Math.sin(time * .17 + c.phase) * skyH * .003;
      skyCtx.globalAlpha = dayness * c.alpha;
      skyCtx.drawImage(cloudSprites[c.sprite], c.x * skyW, c.y * skyH + bob, cw, ch);
    }
    skyCtx.globalAlpha = 1;
  }

  const duskness = THREE.MathUtils.smoothstep(modePhase, .46, .84) *
    (1 - THREE.MathUtils.smoothstep(modePhase, 1.18, 1.52));
  drawGeese(birdCtx, dt, time, duskness);

  const night = THREE.MathUtils.smoothstep(modePhase, 1.38, 1.92);
  if (night < .015) {
    meteors.length = 0;
    nightArmed = false;
    meteorCooldown = .28;
    return;
  }
  skyCtx.save();
  skyCtx.globalCompositeOperation = 'lighter';

  // A restrained star field, only in the strip of sky above the roofline.
  for (const s of skyStars) {
    const twinkle = .58 + .42 * Math.sin(time * s.speed + s.phase);
    skyCtx.fillStyle = `rgba(224,233,255,${(night * (.18 + twinkle * .42)).toFixed(3)})`;
    skyCtx.beginPath();
    skyCtx.arc(s.x * skyW, s.y * skyH, s.r, 0, TAU);
    skyCtx.fill();
  }

  if (!nightArmed && night > .62) {
    nightArmed = true;
    meteorCooldown = .26;
  }
  if (nightArmed && night > .5) {
    meteorCooldown -= dt;
    if (meteorCooldown <= 0 && meteors.length < 2) {
      spawnMeteor();
      meteorCooldown = 2.1 + rand() * 2.8;
    }
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.age += dt;
    const p = Math.min(1, m.age / m.life);
    if (p >= 1) { meteors.splice(i, 1); continue; }
    const ease = 1 - Math.pow(1 - p, 2.2);
    const hx = m.x + m.dx * m.travel * ease;
    const hy = m.y + m.dy * m.travel * ease;
    const trail = m.trail * (.35 + ease * .65);
    const tx = hx - m.dx * trail;
    const ty = hy - m.dy * trail;
    const alpha = Math.min(1, p * 8) * Math.pow(1 - p, .55) * night;
    const grad = skyCtx.createLinearGradient(tx, ty, hx, hy);
    grad.addColorStop(0, 'rgba(158,182,255,0)');
    grad.addColorStop(.7, `rgba(190,209,255,${(alpha * .5).toFixed(3)})`);
    grad.addColorStop(.96, `rgba(255,255,255,${alpha.toFixed(3)})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    skyCtx.strokeStyle = grad;
    skyCtx.lineCap = 'round';
    skyCtx.lineWidth = 5.6;
    skyCtx.globalAlpha = .22;
    skyCtx.beginPath(); skyCtx.moveTo(tx, ty); skyCtx.lineTo(hx, hy); skyCtx.stroke();
    skyCtx.globalAlpha = 1;
    skyCtx.lineWidth = 1.8;
    skyCtx.beginPath(); skyCtx.moveTo(tx, ty); skyCtx.lineTo(hx, hy); skyCtx.stroke();
    const halo = skyCtx.createRadialGradient(hx, hy, 0, hx, hy, 12);
    halo.addColorStop(0, `rgba(255,255,255,${alpha.toFixed(3)})`);
    halo.addColorStop(.3, `rgba(203,219,255,${(alpha * .42).toFixed(3)})`);
    halo.addColorStop(1, 'rgba(156,178,255,0)');
    skyCtx.fillStyle = halo;
    skyCtx.beginPath(); skyCtx.arc(hx, hy, 12, 0, TAU); skyCtx.fill();
  }
  skyCtx.restore();
}

/* ------------------------------------------------------------------
   Animation
------------------------------------------------------------------ */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  skyW = w; skyH = h;
  const skyDpr = Math.min(devicePixelRatio || 1, 2);
  skyCanvas.width = Math.round(w * skyDpr);
  skyCanvas.height = Math.round(h * skyDpr);
  skyCtx.setTransform(skyDpr, 0, 0, skyDpr, 0, 0);
  birdCanvas.width = Math.round(w * skyDpr);
  birdCanvas.height = Math.round(h * skyDpr);
  birdCtx.setTransform(skyDpr, 0, 0, skyDpr, 0, 0);
}
new ResizeObserver(resize).observe(stage);
resize();

let firstFrame = true;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  const time = clock.elapsedTime;
  // 30-second loop: day → dusk → night, ten seconds each.
  const remainMs = Math.max(0, autoClock.nextAt - performance.now());
  const cyclePct = autoClock.running ? (1 - remainMs / AUTO_STEP_MS) * 100 : 0;
  autoBtn.style.setProperty('--cycle', cyclePct.toFixed(1));
  if (autoClock.running) {
    const secLeft = Math.max(0, Math.ceil(remainMs / 1000));
    if (secLeft !== lastAutoSecond) {
      lastAutoSecond = secLeft;
      autoBtn.title = `自动循环 30 秒 · 下一次切换还有 ${secLeft} 秒 · 快捷键 A`;
    }
  }
  modePhase += (modeTarget - modePhase) * (1 - Math.exp(-dt * 5.8));
  applyMode(modePhase);

  // Canopies breathe rather than sway as one rigid prop.
  for (const t of treeGroups) {
    t.group.rotation.z = Math.sin(time * t.speed + t.phase) * t.amp;
    t.group.rotation.x = Math.cos(time * t.speed * .74 + t.phase * 1.5) * t.amp * .7;
  }
  // petals: fall, drift, spin, respawn at a canopy tip
  for (let i = 0; i < PETAL_COUNT; i++) {
    const p = petalData[i];
    p.y -= p.vy * dt;
    p.x += (Math.sin(time * .9 + p.phase) * .18 + p.drift) * dt;
    p.z += Math.cos(time * .7 + p.phase * 1.3) * .09 * dt;
    if (p.y < .55) spawnPetal(i, false);
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(time * p.spin + p.phase, time * p.spin * .7, p.phase);
    dummy.scale.setScalar(p.s);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;
  // the lamp warms and slightly trembles
  if (modePhase > 1.1) {
    const flicker = .985 + Math.sin(time * 13.7) * .012 + Math.sin(time * 21.3) * .006;
    lampGlowMat.emissiveIntensity *= flicker;
  }
  controls.update();
  renderer.render(scene, camera);
  drawSkyLayer(dt, time);
  if (firstFrame) {
    firstFrame = false;
    document.getElementById('loading').classList.add('off');
    setTimeout(() => document.getElementById('loading')?.remove(), 650);
  }
}
animate();
</script>
